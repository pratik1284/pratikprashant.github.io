    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --text-color: #333;
            --bg-light: #f4f4f9;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            color: var(--text-color);
        }
        /* Header */
        header {
            background: var(--primary-color);
            color: white;
            padding: 2rem 0;
            text-align: center;
        }
        header h1 { margin: 0; font-size: 2.5rem; }
        header p { font-size: 1.2rem; opacity: 0.9; }
        
        /* Navigation */
        nav {
            background: #34495e;
            padding: 0.5rem;
            text-align: center;
            position: sticky;
            top: 0;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        nav a:hover { color: var(--accent-color); }

        /* Sections */
        section { padding: 3rem 1rem; max-width: 800px; margin: auto; }
        h2 { border-bottom: 2px solid var(--accent-color); padding-bottom: 10px; color: var(--primary-color); }
        
        /* Skills Grid */
        .skills-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .skill-tag {
            background: var(--bg-light);
            border: 1px solid #ddd;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        /* Project Cards */
        .project-card {
            background: var(--bg-light);
            border-left: 5px solid var(--accent-color);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .project-tech { font-size: 0.9rem; color: #666; font-style: italic; }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            background: var(--primary-color);
            color: white;
            margin-top: 2rem;
        }
        .contact-btn {
            display: inline-block;
            background: var(--accent-color);
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
